name: Build dashboard

# The run title carries the company, and the refresh proxy reads it back to
# work out who has spent what. Keep the "company:<slug>" shape — worker/
# refresh-worker.js parses it, and its test suite asserts on it. A run it
# cannot parse is charged to EVERY company rather than to none, so a broken
# title makes the caps stricter, never laxer.
run-name: >-
  Dashboard ${{ github.event_name == 'workflow_dispatch'
  && format('{0} company:{1}', inputs.mode, inputs.company)
  || 'rebuild company:none' }}

# There is deliberately NO schedule. Searching costs real money, so it only
# happens when someone asks for it — via the "Refresh posts" button on a
# dashboard, which calls the proxy, which dispatches this.
on:
  workflow_dispatch:      # "Run workflow" button, and what the proxy calls
    inputs:
      company:
        description: "Which company to search for"
        required: true
        default: bloctopus
        type: choice
        options:
          - bloctopus
          - lemur
      mode:
        description: "What to run"
        required: true
        default: auto
        type: choice
        options:
          - auto      # decide from what changed in the company's config
          - gather    # search LinkedIn again (full cost)
          - redraft   # re-score stored posts (no searching)
          - render    # rebuild the pages only (free)

  push:
    branches: [main]      # rebuild whenever a config file (or code) changes
    paths-ignore:
      # The job commits the data files back to the repo. Without this the
      # commit would trigger another run, which would commit again, forever.
      - "data/**"

# One queue for every company and every event, and NEVER cancel. A gather
# spends real money at two vendors before it commits anything, so cancelling
# one mid-flight burns the whole cost for no result. Serialising also keeps
# the unrebased `git push` below safe, and there is no parallelism to win:
# every run rebuilds and deploys the whole site anyway.
concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  # Building is separate from publishing so this workflow can run on a branch.
  # The github-pages environment only permits deployments from the default
  # branch, and that check happens before any step runs — so a job that both
  # builds and deploys cannot be tested anywhere but main.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the data files back
    steps:
      # ref, not the default: a push run checks out the commit that TRIGGERED
      # it, which — for a run that sat in the queue while a gather finished —
      # predates the gather's data commit. It would then render the old posts
      # and deploy them over the fresh ones, leaving git and the live site
      # disagreeing until someone paid for another refresh.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The spend caps live in the worker and are only as good as its tests,
      # which nothing used to run. Cheap, and it fails the build before a
      # broken cap can reach production.
      - name: Test the refresh proxy
        run: node test.mjs
        working-directory: worker

      # A push is someone editing a config file, not a request to spend money,
      # so it gets --no-gather: it re-renders every company from stored posts,
      # but never searches and never re-drafts. If the edit changed something
      # that needs either, the page says so and asks you to press Refresh.
      # Spending happens only when the run was asked for by hand.
      - name: Choose build mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "flag=--${{ inputs.mode }} --company ${{ inputs.company }}" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--auto --no-gather" >> "$GITHUB_OUTPUT"
          fi

      - name: Build dashboards
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/build.py ${{ steps.mode.outputs.flag }}

      # Persist the gathered posts and the already-shown URLs so later rebuilds
      # can skip the searching. This runs on branches too: a gather is expensive
      # enough that throwing its results away just because it ran off main means
      # paying twice to get the same data onto main. Branch pushes don't trigger
      # this workflow, so committing here cannot loop.
      - name: Store gathered data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first: on a company's very first run its data file is
          # untracked, and an unstaged `git diff` reports no change for a new file.
          git add data/
          if git diff --cached --quiet -- data/; then
            echo "No change to stored data."
            exit 0
          fi
          git commit -m "Store dashboard data for $(date -u +%Y-%m-%d)"
          # Serialised by the concurrency group above, so a conflicting push is
          # not expected — but a human dispatching during a rebuild could still
          # cause one, and losing it here would mean losing a paid gather.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push rejected (attempt $attempt) — rebasing onto ${{ github.ref_name }}."
            # This branch, not a hardcoded main: on a branch run, rebasing onto
            # main would not resolve the conflict and the loop would just retry
            # the same rejected push until the paid gather was lost.
            git pull --rebase origin "${{ github.ref_name }}" || exit 1
          done
          git push

      # On main this artifact is what the deploy job publishes. On a branch it
      # is just a downloadable copy of the pages, so a full run can be tested
      # without touching the live dashboards.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload readable copy (branch runs)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages must already be enabled: Settings -> Pages -> Source: GitHub Actions.
      # A workflow token cannot create the Pages site itself ("Resource not
      # accessible by integration"), so this step reads the existing config only.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
