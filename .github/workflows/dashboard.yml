name: Build dashboard

on:
  schedule:
    # 05:30 UTC = 07:30 Ljubljana (summer) / 06:30 (winter), Monday–Friday.
    # Edit the cron line to change when the dashboard refreshes.
    - cron: "30 5 * * 1-5"
  workflow_dispatch: {}   # "Run workflow" button in the Actions tab
  push:
    branches: [main]      # rebuild whenever config.yml (or code) changes

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build dashboard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/build.py

      # Pages must already be enabled: Settings -> Pages -> Source: GitHub Actions.
      # A workflow token cannot create the Pages site itself ("Resource not
      # accessible by integration"), so this step reads the existing config only.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
