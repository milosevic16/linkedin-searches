name: Build dashboard

# There is deliberately NO schedule. Searching costs real money, so it only
# happens when someone asks for it — via the "Refresh posts" button on the
# dashboard, which links here. To go back to automatic refreshes, add:
#   schedule:
#     - cron: "30 5 * * 1,3,5"     # 07:30 Ljubljana, Mon/Wed/Fri
on:
  workflow_dispatch:      # "Run workflow" button — what the page links to
    inputs:
      mode:
        description: "What to run"
        required: true
        default: auto
        type: choice
        options:
          - auto      # decide from what changed in config.yml
          - gather    # search LinkedIn again (full cost)
          - redraft   # re-score stored posts (no searching)
          - render    # rebuild the page only (free)

  push:
    branches: [main]      # rebuild whenever config.yml (or code) changes
    paths-ignore:
      # The job commits data/latest.json back to the repo. Without this the
      # commit would trigger another run, which would commit again, forever.
      - "data/**"

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Building is separate from publishing so this workflow can run on a branch.
  # The github-pages environment only permits deployments from the default
  # branch, and that check happens before any step runs — so a job that both
  # builds and deploys cannot be tested anywhere but main.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit data/latest.json back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # A push is someone editing config.yml, not a request to spend money, so
      # it gets --no-gather: it will re-render or re-draft from stored posts,
      # but never start a search. If the edit changed the keywords, the page
      # says so and asks you to press Refresh. Searching happens only when the
      # run was asked for by hand.
      - name: Choose build mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "flag=--${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--auto --no-gather" >> "$GITHUB_OUTPUT"
          fi

      - name: Build dashboard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/build.py ${{ steps.mode.outputs.flag }}

      # Persist the gathered posts so later rebuilds can skip the searching.
      # This runs on branches too: a gather is expensive enough that throwing
      # its results away just because it ran off main means paying twice to
      # get the same data onto main. Branch pushes don't trigger this workflow,
      # so committing here cannot loop.
      - name: Store gathered data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first: on the very first run data/latest.json is untracked,
          # and an unstaged `git diff` reports no change for a new file.
          git add data/
          if git diff --cached --quiet -- data/; then
            echo "No change to stored data."
            exit 0
          fi
          git commit -m "Store dashboard data for $(date -u +%Y-%m-%d)"
          git push

      # On main this artifact is what the deploy job publishes. On a branch it
      # is just a downloadable copy of the page, so a full run can be tested
      # without touching the live dashboard.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload readable copy (branch runs)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages must already be enabled: Settings -> Pages -> Source: GitHub Actions.
      # A workflow token cannot create the Pages site itself ("Resource not
      # accessible by integration"), so this step reads the existing config only.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
