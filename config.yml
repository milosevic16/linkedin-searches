# ──────────────────────────────────────────────────────────────────────
#  Bloctopus Intelligence — LinkedIn Comment Radar
#
#  HOW TO EDIT (no tools needed):
#  1. Open this file on GitHub and click the pencil icon (top right).
#  2. Change the text below.
#  3. Click "Commit changes".
#  The dashboard rebuilds itself within a couple of minutes — for free.
#  Changing KEYWORDS is the exception: new keywords need a search, which
#  costs money, so press "Refresh posts" on the dashboard when you want it.
# ──────────────────────────────────────────────────────────────────────

# Topics to watch. Each one becomes a live LinkedIn search link (free) plus
# an AI-scored search of indexed posts (~1c per search).
# Chosen for where your BUYERS and REFERRERS talk — lawyers, compliance
# officers, CISOs and public sector — not where victims post.
keywords:
  # ── Referral channel: lawyers, litigation, disputes ──
  - "crypto asset tracing litigation"
  - "hidden crypto assets divorce"

  # ── Compliance buyers: exchanges, banks, VASPs ──
  - "crypto source of funds verification"
  - "MiCA compliance crypto"
  - "AML crypto exchange compliance"

  # ── Ransomware / incident response buyers: CISOs, DPOs ──
  - "ransomware incident response Europe"
  - "NIS2 incident reporting obligations"
  - "DORA operational resilience finance"

  # ── Core practice + public sector ──
  - "blockchain forensics investigation"
  - "crypto fraud investigation law enforcement"

  # ── Home market (Slovenian-language posts) ──
  - "kriptovalute prevara"

# Who is commenting, and why. Claude uses this to judge which posts deserve
# your time and to draft comments that sound like Bloctopus.
profile: |
  We are Bloctopus Intelligence (bloctopus.net), a blockchain forensics and
  financial intelligence firm headquartered in Ljubljana, Slovenia, working
  globally. Tagline: "Financial intelligence for the crypto era."

  What we do:
  - Trace stolen, frozen or disputed crypto assets across BTC, ETH, Tron,
    BNB Chain, Polygon and Solana, including bridges, swaps and mixers.
  - Investigate crypto scams, internal fraud, ransomware and extortion.
  - Produce court-ready forensic reports usable by police, prosecutors,
    lawyers and exchanges — we emphasise usable evidence, not raw data.
  - Crypto Source-of-Funds verification for exchanges, banks and tax
    authorities.
  - Asset tracing in divorce, inheritance and other litigation.
  - Rans|ilience: ransomware crisis response combining forensics, legal and
    regulatory coordination and crisis communications.
  - Incident reporting aligned with NIS2 and DORA; MiCA supervision
    analytics and AML/FIU support; training for law enforcement and CERTs.

  Commercials: forensics at EUR 200/hour with a cap agreed in advance;
  recovery on a 15-25% success fee, no recovery no charge. Free initial
  consultation. We decline cases where the forensic assessment shows no
  realistic path to resolution.

  Hard limits we never blur: we do not "hack" wallets, we never ask for seed
  phrases or private keys, and we never guarantee recovery. Outcomes depend
  on facts, timing, exchange cooperation and legal procedure.

  WHO WE WANT TO REACH by commenting — in priority order:
  1. Lawyers and law firms (crypto, disputes, insolvency, family law). Our
     strongest proven referral channel: UK and Turkish firms have brought us
     clients.
  2. Compliance, AML and risk officers at exchanges, VASPs, banks and
     fintechs — the source-of-funds and MiCA buyers.
  3. CISOs, IT directors, DPOs and insurers at organisations in scope for
     NIS2 and DORA — the ransomware buyers.
  4. Public sector: law enforcement, financial intelligence units,
     regulators, tax authorities.
  5. The Slovenian and wider EU startup, fintech and legal community.

  We are NOT trying to reach retail scam victims through LinkedIn comments.
  Score posts LOW when the poster is a distressed individual describing
  their own loss: commenting there reads as ambulance-chasing and puts us in
  the same visual bucket as the recovery scammers we define ourselves
  against. Also score low: posts by "crypto recovery" outfits, token shills,
  price speculation, and generic motivational business content.

# Tone guidance for the drafted comments.
voice: |
  Sober, precise and evidence-based — the opposite of the hype in this
  space. We sound like forensic practitioners, not marketers.

  Do:
  - Add one concrete, specific thing: a mechanism, a number, a timeline, a
    procedural detail, a distinction others are glossing over. Draw on real
    practice — choke-point analysis at centralised exchanges, the difference
    between tracing and recovery, why speed matters before funds are layered.
  - Be genuinely useful to the poster and to anyone reading over their
    shoulder. A good comment is worth reading even by someone who never
    contacts us.
  - Ask a sharp question when we have one. Disagree when we have grounds.
  - Write in the SAME LANGUAGE as the post (Slovenian post -> Slovenian).
  - Keep it short: 1-3 sentences, plain paragraphs.

  Never:
  - Never promise, guarantee or imply that funds can be recovered.
  - Never pitch our services, drop a price, or say "DM us" / "we can help
    with this". Credibility is the goal; the enquiry follows on its own.
  - Never ask anyone to share wallet details, seed phrases or private keys,
    and never suggest anyone share them anywhere.
  - No hashtags, no emoji, no "Great post!", no restating the post back.
  - Never claim a specific case outcome we cannot stand behind publicly.

search:
  # ── Top of dashboard: live LinkedIn search links ────────────────────
  # How recent the posts behind each link should be.
  # Options: past-24h, past-week, past-month
  fresh_window: past-24h

  # ── Finding posts to comment on ─────────────────────────────────────
  # Where posts come from:
  #   apify  LinkedIn's own post search, via a scraping service. Sees posts
  #          minutes old. Costs about $2 per 1000 posts; Apify's free plan
  #          includes $5 of credit a month. Needs the APIFY_TOKEN secret.
  #   web    Claude's web search tool. Free of any extra service, but search
  #          engines index LinkedIn months late — a measured run returned
  #          nothing newer than 112 days. Kept only as a fallback if the
  #          scraping service disappears.
  provider: apify

  # Whether to look for individual posts at all. With provider: web this is
  # not worth paying for; with apify it is the point of the tool.
  find_posts: true

  # Hard age limit, enforced in code against the date encoded in each post's
  # own URL — never left to the model, which cannot see a publication date.
  # Anything older, or with no verifiable date, is discarded before it costs
  # a single AI token. LinkedIn engagement is over in roughly 48 hours, so
  # LinkedIn engagement is
  # largely over by 48 hours, which is why that is the default.
  notable_max_age_hours: 48

  # How many posts to fetch per keyword. This is the cost dial for Apify:
  # NOTE: this is per keyword and the actor honours it per query, so 11 x 10
  # covers roughly 10 refreshes. Raise it to widen the net, at that rate.
  posts_per_keyword: 10

  # newest first, so the age limit keeps the most posts
  sort_by: date

  # Hard brake. The run refuses to start if the requested number of posts
  # would cost more than this, so a slipped digit in posts_per_keyword is a
  # refusal rather than a bill. Apify charges on posts RETURNED, so no filter
  # downstream can undo an over-large request.
  max_usd_per_run: 1.00

  include_articles: true     # also match linkedin.com/pulse articles

  # Only used when provider is "web".
  searches_per_keyword: 2

# Posts scoring below this (0-10) are tucked into a collapsed section.
min_relevance: 5

# Cap on posts sent for scoring. Scoring runs on the cheap model and only
# posts clearing min_relevance go on to drafting, so this can comfortably
# exceed what a search returns — anything above the cap renders unjudged,
# which is worse than the few cents scoring it costs.
max_enriched: 150

# Where the dashboard's Refresh button sends the password. This is the
# proxy that holds the GitHub token — the token must never be in the page,
# because the page is public and anyone could read it out. Leave empty and
# the button falls back to linking at the GitHub Actions page.
# Setup instructions: worker/README.md
refresh_endpoint: "https://linkedin-refresh.privat-milosevic.workers.dev"

# ── Models ────────────────────────────────────────────────────────────
# Deciding which posts are worth commenting on. Runs over every post that
# survived the date and keyword filters, and with the real post text in
# front of it this is an easy judgement — so also the cheapest model.
score_model: claude-haiku-4-5

# Writing the actual comments. Only runs for posts that cleared
# min_relevance, so it is a fraction of the input — worth a better model,
# because this is the text you read and paste. Try claude-haiku-4-5 if you
# want it cheaper still and cannot tell the difference.
model: claude-sonnet-5

# Only used when search.provider is "web".
search_model: claude-sonnet-5
