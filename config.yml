# ──────────────────────────────────────────────────────────────────────
#  LinkedIn Comment Radar — configuration
#
#  HOW TO EDIT (no tools needed):
#  1. Open this file on GitHub and click the pencil icon (top right).
#  2. Change the text below.
#  3. Click "Commit changes".
#  The dashboard rebuilds itself automatically within a couple of minutes.
# ──────────────────────────────────────────────────────────────────────

# What to search for. One entry per line, in quotes.
# These are ordinary search queries — plain language works best.
keywords:
  - "fintech regulation"          # ← EXAMPLES — replace with your real topics
  - "digital banking Slovenia"
  - "MiCA crypto licensing"

# Who is commenting, and why. Claude uses this to judge which posts are
# worth your time and to draft comments that sound like you.
profile: |
  EXAMPLE — replace with your own description.
  We are two consultants who help fintech companies navigate EU regulation.
  We comment on LinkedIn to build visibility with founders, compliance
  officers and investors. Knowledgeable but approachable — never salesy.

# Tone guidance for the drafted comments.
voice: |
  Professional but warm. Short paragraphs. No hashtags, no emoji.
  Always add a concrete insight, example or question — never generic
  praise like "Great post!". Write in the same language as the post.

search:
  # ── Top of dashboard: live LinkedIn search links ────────────────────
  # How recent the posts behind each link should be.
  # Options: past-24h, past-week, past-month
  fresh_window: past-24h

  # ── Bottom of dashboard: AI-scored "notable" posts ──────────────────
  # Search engines index only a thin, delayed slice of LinkedIn, so this
  # section reaches back months rather than days. Anything under ~30 here
  # will usually return nothing at all.
  notable_days: 90
  include_articles: true     # also match linkedin.com/pulse articles

  # Web searches run per keyword, each with a different phrasing.
  # A single search returns a limited number of results (~10) and that count
  # is NOT adjustable — so if you want MORE posts found, raise this number.
  # Each search costs about 1 cent. 3 keywords x 3 searches = ~9c per run.
  searches_per_keyword: 3

# Posts scoring below this (0–10) are tucked into a collapsed section.
min_relevance: 5

# Cost control: at most this many posts get AI scoring + drafts per run.
max_enriched: 30

# Claude model used for scoring and comment drafting.
model: claude-opus-5
