# ──────────────────────────────────────────────────────────────────────
#  LinkedIn Comment Radar — who this dashboard serves
#
#  This file is the ROSTER only. Each company's own settings — keywords,
#  profile, voice, models, thresholds — live in its own file under
#  companies/, and each of those files is complete on its own.
#
#  That is deliberate, and it is about money. A build decides what to redo
#  by hashing the settings that affect the result: change a keyword and it
#  must search again (~$0.62); change the voice or a model and it must
#  re-draft (~$0.42); change nothing and the page rebuilds for free. If the
#  models and thresholds sat here, shared, then nudging one of them would
#  invalidate EVERY company's drafts at once and bill for all of them from a
#  single commit. Kept per company, the cost stays visible: two companies
#  means two deliberate edits, and two bills you chose to pay.
#
#  So: nothing that costs money belongs in this file. The build refuses to
#  start if any such setting appears here, rather than let it drift back in.
# ──────────────────────────────────────────────────────────────────────

# Every company with a dashboard, in order. The FIRST one is the default:
# its page is the site root, so its bookmark never changes. The others get a
# sub-path — lemur's page is at /lemur/.
#
# Each slug needs a matching companies/<slug>.yml.
companies:
  - bloctopus
  - lemur

# Where the Refresh button on every dashboard sends the password. One proxy
# serves all companies; it holds the GitHub token, which must never be in the
# page, because the page is public and anyone could read it out. Leave empty
# and the buttons fall back to linking at the GitHub Actions page.
# Setup instructions: worker/README.md
refresh_endpoint: "https://linkedin-refresh.privat-milosevic.workers.dev"
